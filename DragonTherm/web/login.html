<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="火龙果智能温控系统登录">
    <title>火龙果智能温控系统 - 登录</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="particles-js"></div>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg width="100%" height="100%" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ff9a8b" />
                                <stop offset="100%" stop-color="#d57eeb" />
                            </linearGradient>
                        </defs>
                        <path d="M32,4 C47.464,4 60,16.536 60,32 C60,47.464 47.464,60 32,60 C16.536,60 4,47.464 4,32 C4,16.536 16.536,4 32,4 Z" fill="url(#logo-gradient)"/>
                        <circle cx="32" cy="32" r="22" fill="#fff"/>
                        <circle cx="28" cy="25" r="1.5" fill="#333"/>
                        <circle cx="36" cy="28" r="1.5" fill="#333"/>
                        <circle cx="31" cy="35" r="2" fill="#333"/>
                        <circle cx="42" cy="38" r="1.5" fill="#333"/>
                        <circle cx="25" cy="40" r="1.5" fill="#333"/>
                    </svg>
                </div>
                <h1 class="login-title">火龙果智能温控系统</h1>
                <p class="login-subtitle">Dragon Fruit Smart Temperature Control System</p>
            </div>

            <div class="login-tabs">
                <button type="button" class="tab-btn active" data-tab="password">账号登录</button>
                <button type="button" class="tab-btn" data-tab="sms">短信登录</button>
                <button type="button" class="tab-btn" data-tab="wechat">微信登录</button>
                <button type="button" class="tab-btn" data-tab="register">注册账号</button>
            </div>

            <form class="login-form" id="loginForm" autocomplete="off" novalidate>
                <div class="tab-content active" data-content="password">
                    <div class="form-group">
                        <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span>
                        <input type="tel" id="phone1" name="phone" placeholder=" " maxlength="11" inputmode="numeric" pattern="[0-9]{11}" required>
                        <label for="phone1">手机号</label>
                        <span class="error-msg" id="phone1Error"></span>
                    </div>
                    <div class="form-group">
                        <div class="password-wrapper">
                            <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
                            <input type="password" id="password" name="password" placeholder=" " autocomplete="new-password" required>
                            <label for="password">密码</label>
                            <button type="button" class="toggle-pwd" id="togglePwd" aria-label="显示密码">👁</button>
                        </div>
                        <span class="error-msg" id="passwordError"></span>
                    </div>
                    <button type="submit" class="submit-btn" data-tab="password">登 录</button>
                </div>

                <div class="tab-content" data-content="sms">
                    <div class="form-group">
                        <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span>
                        <input type="tel" id="phone2" name="phone2" placeholder=" " maxlength="11" inputmode="numeric" pattern="[0-9]{11}" required>
                        <label for="phone2">手机号</label>
                        <span class="error-msg" id="phone2Error"></span>
                    </div>
                    <div class="form-group">
                        <div class="sms-wrapper">
                            <div class="sms-input-group">
                                <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></span>
                                <input type="text" id="smsCode" placeholder=" " maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required>
                                <label for="smsCode">短信验证码</label>
                            </div>
                            <button type="button" class="sms-btn" id="sendSmsBtn">获取验证码</button>
                        </div>
                        <span class="error-msg" id="smsCodeError"></span>
                    </div>
                    <button type="submit" class="submit-btn" data-tab="sms">登 录</button>
                </div>

                <div class="tab-content" data-content="wechat">
                    <div class="wechat-login">
                        <div class="wechat-qr">
                            <div class="qr-icon">💬</div>
                            <p>请使用微信扫一扫</p>
                            <p class="wechat-tip">或点击下方按钮模拟微信授权</p>
                        </div>
                        <div class="wechat-form">
                            <div class="form-group">
                                <label for="wechatCode">微信授权码 (模拟)</label>
                                <input type="text" id="wechatCode" placeholder="请输入微信授权码或OpenId">
                            </div>
                            <button type="submit" class="submit-btn" data-tab="wechat">微信登录</button>
                        </div>
                    </div>
                </div>

                <div class="tab-content" data-content="register">
                    <div class="form-group">
                        <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></span>
                        <input type="tel" id="regPhone" name="regPhone" placeholder=" " maxlength="11" inputmode="numeric" pattern="[0-9]{11}" required>
                        <label for="regPhone">手机号</label>
                        <span class="error-msg" id="regPhoneError"></span>
                    </div>
                    <div class="form-group">
                        <div class="password-wrapper">
                            <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
                            <input type="password" id="regPassword" name="regPassword" placeholder=" " autocomplete="new-password" required>
                            <label for="regPassword">密码</label>
                            <button type="button" class="toggle-pwd" id="regTogglePwd" aria-label="显示密码">👁</button>
                        </div>
                        <span class="error-msg" id="regPasswordError"></span>
                    </div>
                    <div class="form-group">
                        <div class="password-wrapper">
                            <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
                            <input type="password" id="regConfirmPassword" name="regConfirmPassword" placeholder=" " autocomplete="new-password" required>
                            <label for="regConfirmPassword">确认密码</label>
                            <button type="button" class="toggle-pwd" id="regConfirmTogglePwd" aria-label="显示密码">👁</button>
                        </div>
                        <span class="error-msg" id="regConfirmPasswordError"></span>
                    </div>
                    <div class="form-group">
                        <span class="input-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
                        <input type="text" id="regNickname" name="regNickname" placeholder=" " maxlength="20" required>
                        <label for="regNickname">昵称（选填）</label>
                        <span class="error-msg" id="regNicknameError"></span>
                    </div>
                    <button type="submit" class="submit-btn" data-tab="register">注 册</button>
                </div>
            </form>

            <div class="login-footer">
                <p>测试账号: 13546069966 / 123456</p>
                <p>没有账号？点击「注册账号」立即注册</p>
                <p>&copy; 2026 火龙果智能温控系统</p>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <p>登录中...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="particles-config.js"></script>
    <script src="login.js"></script>
</body>
</html>
